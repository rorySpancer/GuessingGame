<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Guessing game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
    <h1>Guessing game</h1>
    <p>Try to guess random number from 1 to 100</p>

    <button onclick="guess()">Try guess</button>
    <p id="feedbackElement"></p>
    </div>
    <script src="script.js"></script>
</body>
</html>
